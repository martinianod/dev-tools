name: developer-quality-observability-hub

services:
  control-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["core"]
    mem_limit: ${HUB_API_MEM_LIMIT:-1024m}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      HUB_API_HOST: 0.0.0.0
      HUB_PUBLIC_BIND_ADDRESS: ${HUB_BIND_ADDRESS:-127.0.0.1}
      HUB_API_PORT: ${HUB_API_PORT:-18080}
      HUB_WEB_PORT: ${HUB_WEB_PORT:-18000}
      HUB_DATA_DIR: ${HUB_DATA_DIR:-/app/data}
      HOME: /home/node
      MAVEN_CONFIG: /home/node/.m2
      GRADLE_USER_HOME: /home/node/.gradle
      NPM_CONFIG_CACHE: /home/node/.npm
      PROJECTS_ROOT: /workspace/projects
      HUB_AUTH_TOKEN: ${HUB_AUTH_TOKEN:-}
      HUB_AUTH_ACTOR_ID: ${HUB_AUTH_ACTOR_ID:-}
      HUB_AUTH_ROLE: ${HUB_AUTH_ROLE:-ADMIN}
      HUB_ALLOWED_ORIGINS: ${HUB_ALLOWED_ORIGINS:-}
      HUB_REQUEST_BODY_LIMIT_BYTES: ${HUB_REQUEST_BODY_LIMIT_BYTES:-1048576}
      HUB_RATE_LIMIT_MAX_MUTATIONS: ${HUB_RATE_LIMIT_MAX_MUTATIONS:-60}
      HUB_RATE_LIMIT_WINDOW_MS: ${HUB_RATE_LIMIT_WINDOW_MS:-60000}
      HUB_UPSTREAM_TIMEOUT_MS: ${HUB_UPSTREAM_TIMEOUT_MS:-5000}
      HUB_UPSTREAM_RESPONSE_LIMIT_BYTES: ${HUB_UPSTREAM_RESPONSE_LIMIT_BYTES:-1048576}
      HUB_ALLOWED_UPSTREAM_ORIGINS: ${HUB_ALLOWED_UPSTREAM_ORIGINS:-}
      HUB_PRIVILEGED_EXECUTION_ENABLED: "0"
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-1800}
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://host.docker.internal:9000}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      ALERTMANAGER_URL: http://alertmanager:9093
      GRAFANA_URL: http://grafana:3000
      JENKINS_INTERNAL_URL: http://jenkins:8080
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_API_PORT:-18080}:18080"
    volumes:
      - ./apps/control-api:/app/apps/control-api:ro
      - ./apps/web:/app/apps/web:ro
      - ./config/project-catalog.yaml:/app/config/project-catalog.yaml:ro
      - ./package.json:/app/package.json:ro
      - ./README.md:/app/README.md:ro
      - ./AGENTS.md:/app/AGENTS.md:ro
      - ./PROMPT_MASTER_PLATFORM.md:/app/PROMPT_MASTER_PLATFORM.md:ro
      - ./docs:/app/docs:ro
      - ./docs/live:/app/docs/live:rw
      - hub_data:/app/data
      - hub_maven_cache:/home/node/.m2
      - hub_gradle_cache:/home/node/.gradle
      - hub_npm_cache:/home/node/.npm
      - ${PROJECTS_ROOT:-./projects}:/workspace/projects:ro
    networks:
      - hub-core
      - hub-observability
      - hub-quality
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    profiles: ["core"]
    user: "101:101"
    mem_limit: ${HUB_WEB_MEM_LIMIT:-128m}
    privileged: false
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_WEB_PORT:-18000}:8080"
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - hub-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  hub-postgres:
    image: postgres:16.4-alpine
    profiles: ["stateful"]
    mem_limit: ${HUB_POSTGRES_MEM_LIMIT:-384m}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${HUB_POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${HUB_POSTGRES_DB:-qualityhub}
    volumes:
      - hub_postgres_data:/var/lib/postgresql/data
    networks:
      - hub-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_POSTGRES_USER:-hub} -d ${HUB_POSTGRES_DB:-qualityhub}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1-alpine
    profiles: ["stateful"]
    user: "999:1000"
    mem_limit: ${HUB_REDIS_MEM_LIMIT:-128m}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hub_redis_data:/data
    networks:
      - hub-core
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    profiles: ["quality"]
    mem_limit: ${SONARQUBE_MEM_LIMIT:-2g}
    privileged: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      sonar-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/${SONAR_POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_WEB_JAVAOPTS: ${SONAR_WEB_JAVAOPTS:--Xms128m -Xmx512m}
      SONAR_CE_JAVAOPTS: ${SONAR_CE_JAVAOPTS:--Xms128m -Xmx512m}
      SONAR_SEARCH_JAVAOPTS: ${SONAR_SEARCH_JAVAOPTS:--Xms512m -Xmx512m}
    volumes:
      - hub_sonarqube_data:/opt/sonarqube/data
      - hub_sonarqube_extensions:/opt/sonarqube/extensions
      - hub_sonarqube_logs:/opt/sonarqube/logs
    networks:
      - hub-quality
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 5
          http://127.0.0.1:9000/api/system/status
          | grep -q '"status":"UP"'
          && curl --silent --show-error --max-time 5
          --user admin:admin
          http://127.0.0.1:9000/api/authentication/validate
          | grep -q '"valid":false'
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

  sonarqube-credential-bootstrap:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    profiles: ["quality"]
    user: "1000:1000"
    mem_limit: 64m
    privileged: false
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/bash", "/opt/sonarqube-bootstrap/bootstrap-credentials.sh"]
    environment:
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-}
    volumes:
      - ./sonarqube/scripts/bootstrap-credentials.sh:/opt/sonarqube-bootstrap/bootstrap-credentials.sh:ro
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - hub-quality

  sonarqube-gateway:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    profiles: ["quality"]
    user: "101:101"
    mem_limit: 128m
    privileged: false
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:8080"
    volumes:
      - ./sonarqube/config/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sonarqube:
        condition: service_healthy
      sonarqube-credential-bootstrap:
        condition: service_completed_successfully
    networks:
      - hub-quality
      - hub-quality-host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  sonar-postgres:
    image: postgres:16.4-alpine
    profiles: ["quality"]
    mem_limit: ${SONAR_POSTGRES_MEM_LIMIT:-512m}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${SONAR_POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${SONAR_POSTGRES_DB:-sonarqube}
    volumes:
      - hub_sonar_postgres_data:/var/lib/postgresql/data
    networks:
      - hub-quality
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_POSTGRES_USER:-sonar} -d ${SONAR_POSTGRES_DB:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["metrics", "observability"]
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-24h}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-512MB}
      - --web.enable-lifecycle
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - hub_prometheus_data:/prometheus
    networks:
      - hub-observability
      - hub-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["metrics", "observability"]
    mem_limit: ${GRAFANA_MEM_LIMIT:-384m}
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$${GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION}" != "true" ]; then
          test -n "$${GF_SECURITY_ADMIN_USER}" || { echo "GRAFANA_ADMIN_USER is required" >&2; exit 1; }
          test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "GRAFANA_ADMIN_PASSWORD is required" >&2; exit 1; }
        fi
        exec /run.sh
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: ${GRAFANA_DISABLE_INITIAL_ADMIN_CREATION:-true}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - hub_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - hub-observability
      - hub-observability-host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:3.3.2
    profiles: ["logging", "observability"]
    mem_limit: ${LOKI_MEM_LIMIT:-512m}
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-13100}:3100"
    volumes:
      - ./config/loki:/etc/loki:ro
      - hub_loki_data:/loki
    networks:
      - hub-observability
      - hub-observability-host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["tracing", "observability"]
    mem_limit: ${TEMPO_MEM_LIMIT:-512m}
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/tempo/tempo.yml"]
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${TEMPO_PORT:-13200}:3200"
    volumes:
      - ./config/tempo:/etc/tempo:ro
      - hub_tempo_data:/tmp/tempo
    networks:
      - hub-observability
      - hub-observability-host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  tempo-init:
    image: busybox:1.36.1
    profiles: ["tracing", "observability"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - "mkdir -p /tmp/tempo/blocks /tmp/tempo/wal /tmp/tempo/generator/wal && chown -R 10001:10001 /tmp/tempo"
    volumes:
      - hub_tempo_data:/tmp/tempo
    networks:
      - hub-observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ["tracing", "observability"]
    mem_limit: ${OTEL_COLLECTOR_MEM_LIMIT:-384m}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${OTEL_GRPC_PORT:-14317}:4317"
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${OTEL_HTTP_PORT:-14318}:4318"
    volumes:
      - ./config/otel/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      tempo:
        condition: service_healthy
    networks:
      - hub-observability
      - hub-observability-host

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["alerting", "observability"]
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - hub_alertmanager_data:/alertmanager
    networks:
      - hub-observability
      - hub-observability-host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    profiles: ["alerting", "observability", "infra"]
    mem_limit: ${BLACKBOX_MEM_LIMIT:-128m}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./config/blackbox:/etc/blackbox:ro
    networks:
      - hub-observability
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9115/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    profiles: ["ci"]
    mem_limit: ${JENKINS_MEM_LIMIT:-1536m}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1536m
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${JENKINS_ADMIN_ID}" || { echo "JENKINS_ADMIN_ID is required" >&2; exit 1; }
        test -n "$${JENKINS_ADMIN_PASSWORD}" || { echo "JENKINS_ADMIN_PASSWORD is required" >&2; exit 1; }
        exec /usr/bin/tini -- /usr/local/bin/jenkins.sh
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:18082/}
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      JAVA_OPTS: ${JENKINS_JAVA_OPTS:--Djenkins.install.runSetupWizard=false -Xms128m -Xmx768m}
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${JENKINS_PORT:-18082}:8080"
    volumes:
      - hub_jenkins_home:/var/jenkins_home
      - ./config/jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./config/jenkins/seed:/var/jenkins_home/seed:ro
    networks:
      - hub-core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["infra", "observability"]
    mem_limit: ${CADVISOR_MEM_LIMIT:-256m}
    privileged: false
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - hub-observability

volumes:
  hub_data:
  hub_maven_cache:
  hub_gradle_cache:
  hub_npm_cache:
  hub_postgres_data:
  hub_redis_data:
  hub_sonarqube_data:
  hub_sonarqube_extensions:
  hub_sonarqube_logs:
  hub_sonar_postgres_data:
  hub_prometheus_data:
  hub_grafana_data:
  hub_loki_data:
  hub_tempo_data:
  hub_alertmanager_data:
  hub_jenkins_home:

networks:
  hub-core:
  hub-quality:
    internal: true
  hub-quality-host:
  hub-observability:
    internal: true
  hub-observability-host:
