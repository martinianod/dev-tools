sonar.projectKey=sistema-dietetica
sonar.projectName=Sistema Dietetica
sonar.sourceEncoding=UTF-8

sonar.sources=apps/backend/src/main/java,apps/backend/src/main/resources,apps/web/src
sonar.tests=apps/backend/src/test/java,apps/web/tests
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/tests/**,**/__tests__/**,**/*Test.java,**/*Tests.java

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.gradle/**,**/.idea/**,**/.vscode/**,**/coverage/**,**/out/**,**/.next/**,**/.scannerwork/**,**/.sonar/**,**/*.lock,**/*.map,**/*.min.js,**/package-lock.json,**/yarn.lock,**/pnpm-lock.yaml
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/tests/**,**/__tests__/**,**/*.d.ts,**/*.config.*,**/vite.config.*,**/tailwind.config.*,**/src/main/resources/**

sonar.java.binaries=${env.SONAR_JAVA_BINARIES}
sonar.coverage.jacoco.xmlReportPaths=${env.SONAR_JACOCO_XML_REPORT}
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
