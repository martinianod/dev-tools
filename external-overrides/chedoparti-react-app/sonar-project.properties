sonar.projectKey=chedoparti-react-app
sonar.projectName=Chedoparti React App
sonar.sourceEncoding=UTF-8

# Local/self-hosted SonarQube profile. SonarCloud CI uses
# sonar-project.sonarcloud.properties to keep its controlled Cloud scope.
# scripts/quality/sonar-scan-local.sh can override sources/tests with
# SONAR_SCAN_SCOPE=stable|backend|frontend|full.
sonar.sources=src,apps/admin-web/src,apps/athlo-bff/src,apps/booking-web/app,apps/booking-web/components,apps/booking-web/lib,apps/public-web/src,apps/tenant-web/src,packages/app-shell/src,packages/brand/src,packages/chedoparti-public-sdk/src,packages/copy/src,packages/tokens/src,packages/ui/src,packages/utils-formatting/src,chedoparti-mobile/src,chedoparti-backend/src/main/java,chedoparti-backend/src/main/resources,chedoparti-saas-backend/src/main/java,chedoparti-saas-backend/src/main/resources,chedoparti-gateway/src/main/java,chedoparti-gateway/src/main/resources
sonar.tests=apps/athlo-bff/test,apps/booking-web/__tests__,apps/booking-web/test,chedoparti-mobile/scripts,chedoparti-backend/src/test/java,chedoparti-backend/src/integrationTest/java,chedoparti-saas-backend/src/test/java
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/test/**,**/tests/**,**/__tests__/**,**/*Test.java,**/*Tests.java
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.gradle/**,**/.idea/**,**/.vscode/**,**/coverage/**,**/target/**,**/out/**,**/.next/**,**/ios/**,**/android/**,**/Pods/**,**/vendor/**,**/generated/**,**/.expo/**,**/.turbo/**,**/.cache/**,**/.scannerwork/**,**/.sonar/**,**/*.lock,**/*.map,**/*.min.js,**/package-lock.json,**/yarn.lock,**/pnpm-lock.yaml,src/api/generated/**,packages/chedoparti-public-sdk/src/public-api.ts
sonar.coverage.exclusions=**/__tests__/**,**/test/**,**/tests/**,**/*.test.*,**/*.spec.*,**/*.d.ts,**/*.config.*,**/vite.config.*,**/postcss.config.*,**/tailwind.config.*,**/src/main/resources/**,chedoparti-mobile/scripts/**,src/api/generated/**,packages/chedoparti-public-sdk/src/public-api.ts

# Java values are exported by scripts/quality/sonar-scan-local.sh after
# coverage/build tasks generate classes, JaCoCo reports and runtime classpaths.
sonar.java.binaries=${env.SONAR_JAVA_BINARIES}
sonar.java.libraries=${env.SONAR_JAVA_LIBRARIES}
sonar.java.test.libraries=${env.SONAR_JAVA_LIBRARIES}
sonar.coverage.jacoco.xmlReportPaths=${env.SONAR_JACOCO_XML_REPORT}

# JS/TS coverage is imported only when reports exist. Missing reports are not
# treated as fake 0% coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,apps/booking-web/coverage/lcov.info
