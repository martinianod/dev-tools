sonar.projectKey=panorama-mercados
sonar.projectName=Panorama Mercados
sonar.sourceEncoding=UTF-8

sonar.sources=app,components,lib,db,scripts
sonar.tests=app,components,lib
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/tests/**

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.scannerwork/**,**/.sonar/**,**/*.lock,**/*.map,**/*.min.js,**/*.test.*,**/*.spec.*,**/package-lock.json,**/yarn.lock,**/pnpm-lock.yaml
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.d.ts,**/*.config.*,next.config.*,postcss.config.*,tailwind.config.*,vitest.config.*,eslint.config.*,db/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
