name: sonarqube

services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    container_name: ${SONARQUBE_CONTAINER_NAME:-local-sonarqube}
    privileged: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-true}"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 5
          http://127.0.0.1:9000/api/system/status
          | grep -q '"status":"UP"'
          && curl --silent --show-error --max-time 5
          --user admin:admin
          http://127.0.0.1:9000/api/authentication/validate
          | grep -q '"valid":false'
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

  sonarqube-credential-bootstrap:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    container_name: ${SONARQUBE_BOOTSTRAP_CONTAINER_NAME:-local-sonarqube-credential-bootstrap}
    user: "1000:1000"
    mem_limit: 64m
    privileged: false
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/bash", "/opt/sonarqube-bootstrap/bootstrap-credentials.sh"]
    environment:
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-}
    volumes:
      - ./scripts/bootstrap-credentials.sh:/opt/sonarqube-bootstrap/bootstrap-credentials.sh:ro
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - sonarqube-net

  sonarqube-gateway:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    container_name: ${SONARQUBE_GATEWAY_CONTAINER_NAME:-local-sonarqube-gateway}
    user: "101:101"
    mem_limit: 128m
    privileged: false
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:8080"
    volumes:
      - ./config/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sonarqube:
        condition: service_healthy
      sonarqube-credential-bootstrap:
        condition: service_completed_successfully
    networks:
      - sonarqube-net
      - sonarqube-host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  sonarqube-db:
    image: postgres:16-alpine
    container_name: ${SONARQUBE_DB_CONTAINER_NAME:-local-sonarqube-db}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sonarqube-net

volumes:
  sonarqube_data:
    name: ${SONARQUBE_DATA_VOLUME:-local_sonarqube_data}
  sonarqube_extensions:
    name: ${SONARQUBE_EXTENSIONS_VOLUME:-local_sonarqube_extensions}
  sonarqube_logs:
    name: ${SONARQUBE_LOGS_VOLUME:-local_sonarqube_logs}
  sonarqube_db_data:
    name: ${SONARQUBE_DB_VOLUME:-local_sonarqube_db_data}

networks:
  sonarqube-net:
    name: ${SONARQUBE_INTERNAL_NETWORK:-local-sonarqube-net}
    internal: true
  sonarqube-host:
    name: ${SONARQUBE_HOST_NETWORK:-local-sonarqube-host}
