name: sonarqube

services:
  sonarqube:
    image: sonarqube:community
    container_name: local-sonarqube
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "${SONARQUBE_BIND_ADDRESS:-127.0.0.1}:${SONARQUBE_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-true}"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube-net

  sonarqube-db:
    image: postgres:16-alpine
    container_name: local-sonarqube-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sonarqube-net

volumes:
  sonarqube_data:
    name: local_sonarqube_data
  sonarqube_extensions:
    name: local_sonarqube_extensions
  sonarqube_logs:
    name: local_sonarqube_logs
  sonarqube_db_data:
    name: local_sonarqube_db_data

networks:
  sonarqube-net:
    name: local-sonarqube-net
