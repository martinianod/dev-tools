name: sonarqube

services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    container_name: local-sonarqube
    privileged: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "${SONARQUBE_BIND_ADDRESS:-127.0.0.1}:${SONARQUBE_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-true}"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 5
          http://127.0.0.1:9000/api/system/status
          | grep -q '"status":"UP"'
          && curl --silent --show-error --max-time 5
          --user admin:admin
          http://127.0.0.1:9000/api/authentication/validate
          | grep -q '"valid":false'
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

  sonarqube-credential-bootstrap:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    container_name: local-sonarqube-credential-bootstrap
    user: "1000:1000"
    mem_limit: 64m
    privileged: false
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        set +x
        for attempt in $$(seq 1 90); do
          if curl --fail --silent --show-error --max-time 5 \
            http://sonarqube:9000/api/system/status \
            | grep -q '"status":"UP"'; then
            break
          fi
          if [ "$${attempt}" -eq 90 ]; then
            echo "SonarQube credential bootstrap timed out waiting for readiness." >&2
            exit 1
          fi
          sleep 5
        done

        if ! curl --silent --show-error --max-time 5 \
          --user admin:admin \
          http://sonarqube:9000/api/authentication/validate \
          | grep -q '"valid":true'; then
          echo "SonarQube default administrator credential is already disabled; preserving existing credentials."
          exit 0
        fi

        if [ -z "$${SONAR_ADMIN_PASSWORD}" ] \
          || [ "$${SONAR_ADMIN_PASSWORD}" = "admin" ] \
          || [ "$${#SONAR_ADMIN_PASSWORD}" -lt 12 ] \
          || [[ ! "$${SONAR_ADMIN_PASSWORD}" =~ [A-Z] ]] \
          || [[ ! "$${SONAR_ADMIN_PASSWORD}" =~ [a-z] ]] \
          || [[ ! "$${SONAR_ADMIN_PASSWORD}" =~ [0-9] ]] \
          || [[ ! "$${SONAR_ADMIN_PASSWORD}" =~ [^a-zA-Z0-9] ]]; then
          echo "SONAR_ADMIN_PASSWORD must be supplied externally and satisfy the SonarQube password policy." >&2
          exit 1
        fi

        curl --fail --silent --show-error --max-time 10 \
          --user admin:admin \
          --request POST \
          --data-urlencode "login=admin" \
          --data-urlencode "previousPassword=admin" \
          --data-urlencode "password=$${SONAR_ADMIN_PASSWORD}" \
          http://sonarqube:9000/api/users/change_password \
          >/dev/null

        if curl --silent --show-error --max-time 5 \
          --user admin:admin \
          http://sonarqube:9000/api/authentication/validate \
          | grep -q '"valid":true'; then
          echo "SonarQube default administrator credential remains active." >&2
          exit 1
        fi

        curl --fail --silent --show-error --max-time 5 \
          --user "admin:$${SONAR_ADMIN_PASSWORD}" \
          http://sonarqube:9000/api/authentication/validate \
          | grep -q '"valid":true'
        echo "SonarQube default administrator credential disabled."
    environment:
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-}
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - sonarqube-net

  sonarqube-db:
    image: postgres:16-alpine
    container_name: local-sonarqube-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sonarqube-net

volumes:
  sonarqube_data:
    name: local_sonarqube_data
  sonarqube_extensions:
    name: local_sonarqube_extensions
  sonarqube_logs:
    name: local_sonarqube_logs
  sonarqube_db_data:
    name: local_sonarqube_db_data

networks:
  sonarqube-net:
    name: local-sonarqube-net
